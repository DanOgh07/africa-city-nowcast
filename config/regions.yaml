# Single source of truth for the units of analysis.
# NOTE: ground truth is published for counties/regions/governorates/provinces/states,
# not cities. `label_city` is just a human-friendly label for the dominant city.
# Units are intended to be ADM1 boundaries (confirm against GADM / geoBoundaries).

defaults:
  admin_level: 1
  boundary_source: TODO   # gadm | geoboundaries -- decide in docs/decisions/0002-boundaries.md

regions:
  # ---------------- Kenya (KNBS Gross County Product, annual) ----------------
  - id: KEN-nairobi
    country_iso3: KEN
    unit_type: county
    unit_name: Nairobi
    label_city: Nairobi
    aliases: ["Nairobi City", "Nairobi County"]
    ground_truth: {source: knbs_gcp, cadence: annual, status: confirmed}
  - id: KEN-mombasa
    country_iso3: KEN
    unit_type: county
    unit_name: Mombasa
    label_city: Mombasa
    aliases: ["Mombasa City", "Mombasa County"]
    ground_truth: {source: knbs_gcp, cadence: annual, status: confirmed}
  - id: KEN-nakuru
    country_iso3: KEN
    unit_type: county
    unit_name: Nakuru
    label_city: Nakuru
    aliases: ["Nakuru City", "Nakuru County"]
    ground_truth: {source: knbs_gcp, cadence: annual, status: confirmed}
  - id: KEN-kisumu
    country_iso3: KEN
    unit_type: county
    unit_name: Kisumu
    label_city: Kisumu
    aliases: ["Kisumu City", "Kisumu County"]
    ground_truth: {source: knbs_gcp, cadence: annual, status: confirmed}

